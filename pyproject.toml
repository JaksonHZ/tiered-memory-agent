[project]
name = "tiered-memory-agent"
version = "0.1.0"
description = "MCP server with tiered memory for agents: episodic notes and a semantic tree of food-safety norms"
authors = [
    { name = "Jakson Huang Zheng", email = "jaksonhuangz@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "google-genai>=2.34.0",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
]

[project.scripts]
tiered-memory-agent = "tiered_memory_agent.server:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["scripts", "eval"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# CPU-only torch: the PyPI default on Linux pulls ~2 GB of CUDA libraries.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
